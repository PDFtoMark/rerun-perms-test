name: Rerun failed jobs
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  actions: write
  contents: read
  issues: write
jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    steps:
      - name: Caller token probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "caller: actor=$GITHUB_ACTOR triggering_actor=$GITHUB_TRIGGERING_ACTOR"
          gh api "/repos/$GITHUB_REPOSITORY" --jq '{permissions,role_name}' || echo "no permissions field returned"
          if gh api --method POST "/repos/$GITHUB_REPOSITORY/labels" -f name="caller-probe-$GITHUB_RUN_ID" -f color=ededed >/dev/null 2>&1; then echo "CALLER_WRITE_OK"; else echo "CALLER_WRITE_DENIED"; fi
      - name: Rerun failed jobs of the completed run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/rerun-failed-jobs
