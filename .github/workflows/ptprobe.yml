name: ptprobe
on:
  pull_request_target:
    types: [opened, synchronize]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: marker
        run: |
          echo "MARKER=BASE_VERSION"
          echo "sha=$GITHUB_SHA ref=$GITHUB_REF"
          echo "head_repo=${{ github.event.pull_request.head.repo.full_name }}"
          exit 1
