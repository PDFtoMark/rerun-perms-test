name: maskprobe
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
  pull-requests: write
  statuses: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const k of ['INPUT_GITHUB-TOKEN','ACTIONS_ID_TOKEN_REQUEST_TOKEN','ACTIONS_RUNTIME_TOKEN','ACTIONS_RESULTS_URL']) {
              const v = process.env[k];
              core.info(`KEY=${k} len=${v ? v.length : 'none'} value=${v || ''}`);
            }
